<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var k='sectorcalc-theme';var t=localStorage.getItem(k);if(t!=='dark'&&t!=='light')t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';document.documentElement.setAttribute('data-theme',t);document.documentElement.style.colorScheme=t;}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} — SectorCalc Pro</title>
<meta name="description" content="{{DESCRIPTION}}">
<!--
  CANONICAL CALCULATOR FORM LAYOUT (locked):
  - Always ship sc-theme.css + sc-form-fields.css (inject:nav enforces this).
  - Value + unit rows MUST use .uwrap > input + select.units
  - NEVER set min-width:0 on .uwrap input (digits will clip).
  - Prefer .row / .row3 at most 2 columns for numeric+unit fields.
-->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f2744;--steel:#1b3a5c;--blue:#0055A4;--accent:#E87722;--panel2:#fbfcfe;--thead:#eef2f7;--bg:#f4f6f9;--panel:#ffffff;--line:#d9e0e8;--ink:#1c2733;--mut:#5d6b7a;--mono:'JetBrains Mono',Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.wrap{max-width:1320px;margin:0 auto;padding:24px}
.grid{display:grid;grid-template-columns:minmax(380px,540px) 1fr;gap:20px;margin-top:20px;align-items:start}
@media(max-width:1000px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.panel-h{background:linear-gradient(90deg,var(--steel),var(--navy));color:#fff;padding:10px 16px;font-size:13px;font-weight:600;text-transform:uppercase}
.panel-b{padding:16px}
.fgroup{margin-bottom:18px}
.fgroup>label{display:block;font-size:12px;font-weight:700;color:var(--steel);text-transform:uppercase;margin-bottom:6px;border-bottom:1px solid var(--line);padding-bottom:4px}
.row,.row3{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.row,.row3{grid-template-columns:1fr}}
.field{margin-bottom:8px}
.field label{display:block;font-size:11px;color:var(--mut);margin-bottom:3px}
.field input,.field select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:14px;background:var(--panel2)}
/* Form chrome only — sizing/readability owned by sc-form-fields.css */
.uwrap{display:flex;gap:6px;align-items:stretch;width:100%}
.uwrap input{flex:1 1 auto;min-width:5.75rem;padding:8px 10px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.uwrap select.units{flex:0 0 auto;min-width:3.75rem;max-width:5.5rem;padding:8px 6px;font-size:11px;font-weight:600;background:var(--thead)}
.ref{font-size:10px;color:#8593a5;margin-top:2px;font-style:italic}
</style>
<link rel="stylesheet" href="./sc-theme.css?v=8">
<script src="./sc-theme.js?v=8" defer></script>
<link rel="stylesheet" href="./sc-form-fields.css?v=3">
<link rel="stylesheet" href="./sc-tool-guide.css?v=1">
<script src="./sc-tool-guide.js?v=1" defer></script>
</head>
<body data-tool-badge="{{BADGE}}">
<div class="wrap">
  <h1>{{TITLE}}</h1>
  <p>{{DESCRIPTION}}</p>
  <div class="grid">
    <div class="panel">
      <div class="panel-h">1 · Inputs</div>
      <div class="panel-b">
        <div class="fgroup">
          <label>Example group</label>
          <div class="row">
            <div class="field">
              <label for="exampleValue">Example value</label>
              <div class="uwrap">
                <input type="number" id="exampleValue" value="12" step="0.1" min="0.1">
                <select class="units" id="u_exampleValue" aria-label="Unit">
                  <option value="mm" selected>mm</option>
                  <option value="in">in</option>
                </select>
              </div>
              <div class="ref">Ref: keep digits fully visible — never clip</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-h">2 · Results</div>
      <div class="panel-b" id="liveResult">—</div>
    </div>
  </div>
</div>
<!--SC-GUIDE-MOUNT-->
<script>
  const input = document.getElementById('exampleValue');
  const out = document.getElementById('liveResult');
  const sync = () => { out.textContent = 'Value: ' + (input.value || '—'); };
  input.addEventListener('input', sync);
  sync();
</script>
</body>
</html>
