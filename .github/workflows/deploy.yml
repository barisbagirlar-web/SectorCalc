name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sectorcalc-production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Validate preview → promote exact Firebase version → verify live
    # Playwright 1.42.x --with-deps is broken on ubuntu-24.04 (libasound2 → t64).
    # Keep deploy on 22.04 so the preview E2E seal matches CI/Regression runners.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # Need HEAD~1 to diff against for the billing functions change gate.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Firebase credential present
        run: |
          if [ -z "${FIREBASE_TOKEN:-}" ]; then
            echo "::error::FIREBASE_TOKEN secret is not configured."
            exit 1
          fi
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Production quality gate
        env:
          VITE_PADDLE_ENV: production
          VITE_PADDLE_CLIENT_TOKEN: live_6649e40d5c0200d0fe72895efe9
        run: |
          npm test
          npm run typecheck
          npm run build
          npm run verify:seo

      - name: Detect billing function changes
        id: functions-diff
        run: |
          set -euo pipefail
          CHANGED="false"
          # On push, only run the functions deploy when functions/ actually
          # changed (its GCP Secret Manager billing gate can otherwise block
          # every hosting promotion). Manual dispatch always attempts it.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q '^functions/'; then
            CHANGED="true"
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "billing functions changed: $CHANGED"

      - name: Deploy billing Cloud Functions + Firestore rules
        if: steps.functions-diff.outputs.changed == 'true'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          npm --prefix functions ci --no-audit --no-fund
          npm --prefix functions run build
          npx --yes firebase-tools@14 deploy \
            --only functions,firestore:rules,firestore:indexes \
            --project sectorcalc-prod \
            --token "$FIREBASE_TOKEN" \
            --non-interactive \
            --force

      - name: Deploy immutable candidate to Firebase preview channel
        id: preview
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          # Reuse a single preview channel to avoid Firebase Hosting channel quota exhaustion.
          # Each deploy overwrites the candidate; promote still clones this exact channel → live.
          CHANNEL_ID="release-candidate"
          LOG_FILE="$(mktemp)"
          echo "channel_id=$CHANNEL_ID" >> "$GITHUB_OUTPUT"
          # Best-effort prune of leftover release-* SHA channels from prior deploys.
          node scripts/prune-firebase-preview-channels.mjs || true
          npx --yes firebase-tools@14 hosting:channel:deploy "$CHANNEL_ID" \
            --expires 7d \
            --project sectorcalc-prod \
            --token "$FIREBASE_TOKEN" \
            --non-interactive | tee "$LOG_FILE"
          PREVIEW_URL="$(grep -Eo 'https://[-A-Za-z0-9.]+\.web\.app' "$LOG_FILE" | tail -1 || true)"
          if [ -z "$PREVIEW_URL" ]; then
            echo "::error::Firebase preview URL could not be resolved from CLI output."
            exit 1
          fi
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "Preview candidate: $PREVIEW_URL"

      - name: Wait for preview-channel edge propagation
        run: sleep 20

      - name: Hard-refresh SEO guard on preview candidate
        env:
          SEO_GUARD_HOST: ${{ steps.preview.outputs.preview_url }}
          SEO_GUARD_MODE: preview
        run: node scripts/seo-live-guard.mjs

      - name: Preview E2E critical seal (block promote on broken candidate)
        env:
          BASE_URL: ${{ steps.preview.outputs.preview_url }}
          CI: true
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npx playwright test --project=chromium --grep @critical

      - name: Promote the exact validated Firebase version to live
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          CHANNEL_ID: ${{ steps.preview.outputs.channel_id }}
        run: |
          set -euo pipefail
          npx --yes firebase-tools@14 hosting:clone \
            "sectorcalc-prod:${CHANNEL_ID}" \
            "sectorcalc-prod:live" \
            --project sectorcalc-prod \
            --token "$FIREBASE_TOKEN" \
            --non-interactive

      - name: Wait for custom-domain edge propagation
        run: sleep 15

      - name: Post-promotion hard-refresh SEO guard on production
        env:
          SEO_GUARD_HOST: https://sectorcalc.com
          SEO_GUARD_MODE: live
        run: node scripts/seo-live-guard.mjs

      - name: Post-promotion billing health seal
        run: |
          set -euo pipefail
          BODY="$(curl -fsS https://sectorcalc.com/api/billing/health)"
          echo "$BODY"
          echo "$BODY" | grep -q '"ok":true'
          echo "$BODY" | grep -q '"service":"sectorcalc-billing"'

      # Seal: live Paddle auth + all 4 production prices must pass after promotion.
      # If the API key is revoked, permissions lost, or a price breaks, deploy fails here.
      - name: Post-promotion Paddle live seal (readiness)
        run: |
          set -euo pipefail
          BODY="$(curl -fsS https://sectorcalc.com/api/billing/readiness)"
          echo "$BODY"
          echo "$BODY" | grep -q '"ok":true'
          echo "$BODY" | grep -q '"paddleAuthProbe":true'
          echo "$BODY" | grep -q '"prices":true'
          echo "$BODY" | grep -q '"webhookSecret":true'

      - name: Post-promotion calculator asset seal
        run: |
          set -euo pipefail
          HTML="$(curl -fsS https://sectorcalc.com/calculator/tolerance-stack-up)"
          echo "$HTML" | grep -E 'src="/assets/[^"]+\.js"' >/dev/null
          ! echo "$HTML" | grep -E 'src="\./assets/' >/dev/null
          ASSET="$(echo "$HTML" | grep -Eo 'src="/assets/[^"]+\.js"' | head -1 | sed 's/src="//;s/"$//')"
          test -n "$ASSET"
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' "https://sectorcalc.com${ASSET}")"
          test "$CODE" = "200"

      - name: Post-promotion host parity seal
        run: npm run verify:host-parity

      - name: Post-promotion legacy surface seal
        env:
          LEGACY_SURFACE_MODE: live
        run: npm run verify:legacy-surface
