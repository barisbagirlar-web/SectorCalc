name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sectorcalc-production-deploy
  cancel-in-progress: true

jobs:
  deploy-production:
    name: Firebase production deploy + live SEO guard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify Firebase credential present
        run: |
          if [ -z "${FIREBASE_TOKEN:-}" ]; then
            echo "::error::FIREBASE_TOKEN secret is not configured. Add it in repo Settings > Secrets, then re-run."
            exit 1
          fi
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Production quality gate
        run: |
          npm test
          npm run typecheck
          npm run build
          npm run verify:seo
      - name: Deploy Firebase Hosting (sectorcalc-prod)
        run: npx --yes firebase-tools@14 deploy --only hosting --project sectorcalc-prod --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      - name: Wait for edge propagation
        run: sleep 12
      - name: Post-deploy hard-refresh SEO guard
        run: node scripts/seo-live-guard.mjs
