name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sectorcalc-production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Validate preview → promote exact Firebase version → verify live
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Firebase credential present
        run: |
          if [ -z "${FIREBASE_TOKEN:-}" ]; then
            echo "::error::FIREBASE_TOKEN secret is not configured."
            exit 1
          fi
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Production quality gate
        run: |
          npm test
          npm run typecheck
          npm run build
          npm run verify:seo

      - name: Deploy billing Cloud Functions + Firestore rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          npm --prefix functions ci --no-audit --no-fund
          npm --prefix functions run build
          npx --yes firebase-tools@14 deploy \
            --only functions,firestore:rules,firestore:indexes \
            --project sectorcalc-prod \
            --token "$FIREBASE_TOKEN" \
            --non-interactive \
            --force

      - name: Deploy immutable candidate to Firebase preview channel
        id: preview
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          CHANNEL_ID="release-${GITHUB_SHA::12}"
          LOG_FILE="$(mktemp)"
          echo "channel_id=$CHANNEL_ID" >> "$GITHUB_OUTPUT"
          npx --yes firebase-tools@14 hosting:channel:deploy "$CHANNEL_ID" \
            --expires 1d \
            --project sectorcalc-prod \
            --token "$FIREBASE_TOKEN" \
            --non-interactive | tee "$LOG_FILE"
          PREVIEW_URL="$(grep -Eo 'https://[-A-Za-z0-9.]+\.web\.app' "$LOG_FILE" | tail -1 || true)"
          if [ -z "$PREVIEW_URL" ]; then
            echo "::error::Firebase preview URL could not be resolved from CLI output."
            exit 1
          fi
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "Preview candidate: $PREVIEW_URL"

      - name: Wait for preview-channel edge propagation
        run: sleep 20

      - name: Hard-refresh SEO guard on preview candidate
        env:
          SEO_GUARD_HOST: ${{ steps.preview.outputs.preview_url }}
          SEO_GUARD_MODE: preview
        run: node scripts/seo-live-guard.mjs

      - name: Preview E2E critical seal (block promote on broken candidate)
        env:
          BASE_URL: ${{ steps.preview.outputs.preview_url }}
          CI: true
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npx playwright test --project=chromium --grep @critical

      - name: Promote the exact validated Firebase version to live
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          CHANNEL_ID: ${{ steps.preview.outputs.channel_id }}
        run: |
          set -euo pipefail
          npx --yes firebase-tools@14 hosting:clone \
            "sectorcalc-prod:${CHANNEL_ID}" \
            "sectorcalc-prod:live" \
            --project sectorcalc-prod \
            --token "$FIREBASE_TOKEN" \
            --non-interactive

      - name: Wait for custom-domain edge propagation
        run: sleep 15

      - name: Post-promotion hard-refresh SEO guard on production
        env:
          SEO_GUARD_HOST: https://sectorcalc.com
          SEO_GUARD_MODE: live
        run: node scripts/seo-live-guard.mjs

      - name: Post-promotion billing health seal
        run: |
          set -euo pipefail
          BODY="$(curl -fsS https://sectorcalc.com/api/billing/health)"
          echo "$BODY"
          echo "$BODY" | grep -q '"ok":true'
          echo "$BODY" | grep -q '"RECONCILIATION_SCHEDULER_MISSING":"NO"'
          echo "$BODY" | grep -q '"creditMonetizationEnabled":true'

      - name: Post-promotion calculator asset seal
        run: |
          set -euo pipefail
          HTML="$(curl -fsS https://sectorcalc.com/calculator/tolerance-stack-up)"
          echo "$HTML" | grep -E 'src="/assets/[^"]+\.js"' >/dev/null
          ! echo "$HTML" | grep -E 'src="\./assets/' >/dev/null
          ASSET="$(echo "$HTML" | grep -Eo 'src="/assets/[^"]+\.js"' | head -1 | sed 's/src="//;s/"$//')"
          test -n "$ASSET"
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' "https://sectorcalc.com${ASSET}")"
          test "$CODE" = "200"

      - name: Post-promotion host parity seal
        run: npm run verify:host-parity

      - name: Post-promotion legacy surface seal
        env:
          LEGACY_SURFACE_MODE: live
        run: npm run verify:legacy-surface
