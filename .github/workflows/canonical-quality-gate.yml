name: Canonical Gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  canonical-gate:
    name: Canonical quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: English-only language gate
        run: node scripts/check-language.mjs --strict
      - name: Unit + golden + industrial regression tests
        run: npm test
      - name: Strict TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Navigation and form-field audits
        run: |
          node scripts/verify-nav.mjs
          node scripts/verify-form-fields.mjs
      - name: Unified Decimal production architecture guard
        run: node scripts/verify-unified-engine.mjs
      - name: Enterprise SEO deterministic guard
        run: npm run seo:guard
