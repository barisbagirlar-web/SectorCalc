name: SectorCalc Regression Guard

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # Nightly full matrix against production (post-deploy lag safe)
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-gates:
    name: Static gates (lang + lint + types + unit + SEO SSOT)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Production dependency audit
        run: npm run audit:prod
      - name: English-only language gate
        run: node scripts/check-language.mjs --strict
      - name: JavaScript + TypeScript lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + golden tests
        run: npm test
      - name: Regression catalog freshness
        run: node scripts/export-regression-catalog.mjs --check
      - name: SEO + commerce SSOT seals
        run: |
          npm run verify:seo
          npm run verify:honest-credits
          npm run verify:home-credits

  build-gate:
    name: Production build gate
    runs-on: ubuntu-latest
    needs: [static-gates]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Post-build seals
        run: |
          node scripts/verify-nav.mjs
          node scripts/guard-head-ssot.mjs
          node scripts/guard-case-studies-academic.mjs
          node scripts/guard-tools-prerender.mjs --dist
          node scripts/guard-sitemap-coverage.mjs
          node scripts/verify-form-fields.mjs
          LEGACY_SURFACE_MODE=local npm run verify:legacy-surface

  e2e-local:
    name: E2E local (critical + matrix + a11y + deep)
    runs-on: ubuntu-22.04
    needs: [build-gate]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Playwright enterprise suite
        run: npx playwright test --project=chromium
        env:
          CI: true
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-local-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  e2e-production:
    name: E2E production critical
    runs-on: ubuntu-22.04
    needs: [e2e-local]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Critical flows against live
        run: npx playwright test --project=chromium --grep @critical
        env:
          BASE_URL: https://sectorcalc.com
          CI: true
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-production-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
