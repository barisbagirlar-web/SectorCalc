name: SectorCalc Regression Guard

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-local:
    name: Local regression (typecheck + unit + build + e2e)
    # Playwright 1.42.x installer targets Ubuntu 22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck (strict)
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E critical + smoke (local Vite + Firebase parity)
        run: npx playwright test --project=chromium
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-local
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  regression-production:
    name: Production critical flows
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # Run after local job green; also allow manual dispatch
    needs: [regression-local]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Critical flows against live sectorcalc.com
        run: npx playwright test tests/e2e/critical-flows.spec.ts --project=chromium
        env:
          BASE_URL: https://sectorcalc.com
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-production
          path: |
            playwright-report/
            test-results/
          retention-days: 14
