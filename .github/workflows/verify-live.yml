name: Verify Live Production

on:
  push:
    branches: [deploy-observability]

permissions:
  contents: read
  statuses: write

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Mark verification pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='SectorCalc Live Production Verify' \
            -f description='Checking deployed production contract'
      - name: Verify deployed production
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base='https://www.sectorcalc.com'
          cache_bust="verify=${GITHUB_SHA}"

          post_status() {
            local context="$1" state="$2" description="$3"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state="$state" -f context="$context" -f description="$description" >/dev/null
          }

          fetch_until() {
            local path="$1" out="$2" pattern="$3" context="$4"
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --location \
                --connect-timeout 10 --max-time 30 \
                -H 'Cache-Control: no-cache' \
                "${base}${path}?${cache_bust}&attempt=${attempt}" -o "$out" \
                && grep -Fq "$pattern" "$out"; then
                post_status "$context" success "Live contract verified: ${path}"
                return 0
              fi
              sleep 5
            done
            post_status "$context" failure "Live contract mismatch: ${path}"
            echo "::error::Live content did not converge for ${path}; expected: ${pattern}"
            return 1
          }

          fetch_until '/tools.html' /tmp/tools.html 'id="stLive">25<' 'SectorCalc Live Tools'
          grep -Fq '25</div><div class="l">Live calculators' /tmp/tools.html

          fetch_until '/bearing-pro.html' /tmp/bearing.html 'data-tool-code="SC-021"' 'SectorCalc Live Decimal Pages'
          grep -Fq 'A1 · Engine Identity &amp; Integrity' /tmp/bearing.html
          grep -Fq 'auditWarnings' /tmp/bearing.html

          fetch_until '/quote-pro.html' /tmp/quote.html 'data-tool-code="SC-012"' 'SectorCalc Live Quote'
          grep -Fq 'auditFormulas' /tmp/quote.html

          fetch_until '/heat-input-pro.html' /tmp/heat.html 'data-tool-code="SC-029"' 'SectorCalc Live Weld Heat'
          grep -Fq 'auditAssumptions' /tmp/heat.html

          fetch_until '/sc008-pro.html' /tmp/sc008.html 'SC-008' 'SectorCalc Live SC008'

          fetch_until '/sitemap.xml' /tmp/sitemap.xml 'https://www.sectorcalc.com/hydraulic-pro.html' 'SectorCalc Live Sitemap'
          grep -Fq 'https://www.sectorcalc.com/bearing-freq-pro.html' /tmp/sitemap.xml
          grep -Fq '2026-07-24' /tmp/sitemap.xml

          fetch_until '/llms.txt' /tmp/llms.txt '24 calculators use the schema-driven Decimal.js industrial runtime' 'SectorCalc Live LLMS'
          grep -Fq 'All tools — 25 live, 0 planned' /tmp/llms.txt
          grep -Fq 'A1-A5 Audit/Review' /tmp/llms.txt

          fetch_until '/llm.txt' /tmp/llm.txt 'SC-040 Hydraulic Cylinder Sizing' 'SectorCalc Live LLM'
          grep -Fq 'deterministic input hash' /tmp/llm.txt

          echo 'LIVE_PRODUCTION_VERIFY=PASS'
      - name: Mark verification success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='SectorCalc Live Production Verify' \
            -f description='Live 25-tool, audit and discovery contract verified'
      - name: Mark verification failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='SectorCalc Live Production Verify' \
            -f description='Live production contract verification failed'
