name: Execute Verified Production Release

on:
  push:
    branches: [deploy-observability]

permissions:
  contents: read
  statuses: write

jobs:
  release-main:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout verified main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve release SHA and mark pending
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_sha="$(git rev-parse HEAD)"
          echo "sha=${release_sha}" >> "$GITHUB_OUTPUT"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${release_sha}" \
            -f state=pending \
            -f context='SectorCalc Production Deploy' \
            -f description='Verified main build, guards and Firebase deployment in progress'
      - name: Verify Firebase credential present
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${FIREBASE_TOKEN:-}" ]; then
            echo '::error::FIREBASE_TOKEN secret is not configured.'
            exit 1
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${{ steps.release.outputs.sha }}" \
            -f state=success -f context='SectorCalc Firebase Credential' -f description='Firebase credential is available'
      - name: Install locked dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm ci --no-audit --no-fund
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${{ steps.release.outputs.sha }}" \
            -f state=success -f context='SectorCalc Release Install' -f description='Locked dependency install passed'
      - name: English + unit + golden + industrial tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/check-language.mjs --strict
          npm test
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${{ steps.release.outputs.sha }}" \
            -f state=success -f context='SectorCalc Release Tests' -f description='Language and regression tests passed'
      - name: Strict TypeScript
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run typecheck
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${{ steps.release.outputs.sha }}" \
            -f state=success -f context='SectorCalc Release Typecheck' -f description='Strict TypeScript passed'
      - name: Build + navigation + form + unified-engine guards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run build
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${{ steps.release.outputs.sha }}" \
            -f state=success -f context='SectorCalc Release Build Guard' -f description='Production build and all guards passed'
      - name: Deploy Firebase Hosting (sectorcalc-prod)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          npx --yes firebase-tools@14 deploy --only hosting --project sectorcalc-prod --token "$FIREBASE_TOKEN"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${{ steps.release.outputs.sha }}" \
            -f state=success -f context='SectorCalc Firebase Deploy' -f description='Firebase Hosting deploy command passed'
      - name: Verify live production contract
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base='https://www.sectorcalc.com'
          release_sha='${{ steps.release.outputs.sha }}'

          fetch_until() {
            local path="$1" out="$2" pattern="$3"
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --location \
                --connect-timeout 10 --max-time 30 \
                -H 'Cache-Control: no-cache' \
                "${base}${path}?release=${release_sha}&attempt=${attempt}" -o "$out" \
                && grep -Fq "$pattern" "$out"; then
                return 0
              fi
              sleep 5
            done
            echo "::error::Live content did not converge for ${path}; expected: ${pattern}"
            return 1
          }

          fetch_until '/tools.html' /tmp/tools.html '25</div><div class="l">Live calculators'
          grep -Fq '/hydraulic-pro.html' /tmp/tools.html
          grep -Fq '/bearing-freq-pro.html' /tmp/tools.html
          fetch_until '/bearing-pro.html' /tmp/bearing.html 'data-tool-code="SC-021"'
          grep -Fq 'A1 · Engine Identity &amp; Integrity' /tmp/bearing.html
          grep -Fq 'auditWarnings' /tmp/bearing.html
          fetch_until '/quote-pro.html' /tmp/quote.html 'data-tool-code="SC-012"'
          grep -Fq 'auditFormulas' /tmp/quote.html
          fetch_until '/heat-input-pro.html' /tmp/heat.html 'data-tool-code="SC-029"'
          grep -Fq 'auditAssumptions' /tmp/heat.html
          fetch_until '/sc008-pro.html' /tmp/sc008.html 'SC-008'
          fetch_until '/sitemap.xml' /tmp/sitemap.xml 'https://www.sectorcalc.com/hydraulic-pro.html'
          grep -Fq 'https://www.sectorcalc.com/bearing-freq-pro.html' /tmp/sitemap.xml
          grep -Fq '2026-07-24' /tmp/sitemap.xml
          fetch_until '/llms.txt' /tmp/llms.txt '24 calculators use the schema-driven Decimal.js industrial runtime'
          grep -Fq 'All tools — 25 live, 0 planned' /tmp/llms.txt
          grep -Fq 'A1-A5 Audit/Review' /tmp/llms.txt
          fetch_until '/llm.txt' /tmp/llm.txt 'SC-040 Hydraulic Cylinder Sizing'
          grep -Fq 'deterministic input hash' /tmp/llm.txt

          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${release_sha}" \
            -f state=success -f context='SectorCalc Live Production' -f description='Live 25-tool, audit and discovery contract verified'
          echo 'LIVE_PRODUCTION_VERIFY=PASS'
      - name: Mark main production deploy success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${{ steps.release.outputs.sha }}" \
            -f state=success \
            -f context='SectorCalc Production Deploy' \
            -f description='Firebase deploy and live 25-tool verification passed'
      - name: Mark main production deploy failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_sha='${{ steps.release.outputs.sha }}'
          if [ -n "$release_sha" ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${release_sha}" \
              -f state=failure \
              -f context='SectorCalc Production Deploy' \
              -f description='Production build, deploy or live verification failed'
          fi
