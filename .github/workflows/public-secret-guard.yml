name: Public Secret Guard

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan-public-text:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Verify Node 24 runtime
        run: node --version | grep -E '^v24\.'
      - name: Scan pull request title and body
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          node -e "const fs=require('fs');const e=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));process.stdout.write((e.pull_request.title||'')+'\n'+(e.pull_request.body||''));" \
            | node scripts/verify-public-text-secrets.mjs
      - name: Scan pull request commit messages
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git log --format=%B "origin/${{ github.base_ref }}..HEAD" \
            | node scripts/verify-public-text-secrets.mjs
      - name: Scan pushed commit message
        if: github.event_name == 'push'
        shell: bash
        run: |
          git log -1 --format=%B \
            | node scripts/verify-public-text-secrets.mjs
