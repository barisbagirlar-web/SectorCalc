name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  language-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: English-only language gate
        run: node scripts/check-language.mjs --strict

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Collect typecheck diagnostics
        id: tsc
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          status=$?
          cat typecheck.log
          first_error="$(grep -m1 'error TS' typecheck.log | tr '\n' ' ' | sed 's/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' | cut -c1-180)"
          if [ -z "$first_error" ]; then first_error="typecheck failed without TS diagnostic"; fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "first_error=$first_error" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ] && [ "${{ github.event_name }}" = "pull_request" ]; then
            {
              echo '### Typecheck diagnostics'
              echo '```text'
              head -n 80 typecheck.log
              echo '```'
            } > typecheck-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file typecheck-comment.md || true
          fi
          exit 0
      - name: Typecheck failure — ${{ steps.tsc.outputs.first_error }}
        if: steps.tsc.outputs.status != '0'
        run: exit 1
      - run: npm test
      - run: npm run build
      - run: node scripts/verify-nav.mjs

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
