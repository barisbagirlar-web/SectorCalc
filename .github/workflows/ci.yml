name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  language-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: English-only language gate
        run: node scripts/check-language.mjs --strict

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Unit + golden + industrial regression tests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm test > test.log 2>&1
          status=$?
          cat test.log
          if [ "$status" -ne 0 ] && [ "${{ github.event_name }}" = "pull_request" ]; then
            {
              echo '### Test diagnostics'
              echo '```text'
              tail -n 140 test.log
              echo '```'
            } > test-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file test-comment.md || true
          fi
          exit "$status"
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/verify-nav.mjs

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - run: npm run test:e2e
