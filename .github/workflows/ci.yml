name: CI

on:
  push:
  pull_request:

jobs:
  language-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      # Dependency-free: no npm install needed.
      - name: English-only language gate
        run: node scripts/check-language.mjs --strict

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/verify-nav.mjs
      - run: node scripts/guard-head-ssot.mjs
      - run: node scripts/guard-tools-prerender.mjs --dist
      - name: Legacy surface (local)
        run: LEGACY_SURFACE_MODE=local npm run verify:legacy-surface
      - name: Host parity (live)
        run: npm run verify:host-parity

  e2e:
    # Playwright 1.42.x dependency installer is compatible with Ubuntu 22.04;
    # ubuntu-latest currently resolves to 24.04 and fails before tests start.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
