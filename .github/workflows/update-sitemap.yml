name: Update Sitemap Lastmod
on:
  push:
    branches: [main, ship/mobile-nav-discovery]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh sitemap lastmod from git
        run: node scripts/update-sitemap-lastmod.js
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add public/sitemap.xml
          git diff --cached --quiet || git commit -m "chore: auto-update sitemap lastmod [skip ci]"
          git push
